name: Fehlerbericht
description: Reproduzierbares fehlerhaftes Verhalten
title: "Fix: "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Beobachtetes Verhalten
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktionsschritte
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung und vollständige Fehlermeldung
    validations:
      required: true
